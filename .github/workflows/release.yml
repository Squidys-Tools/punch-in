name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Check types
        run: bun run typecheck

      - name: Build release artifacts
        run: bun run build:release

      - name: Verify release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          release_dir="dist/releases"
          expected_files=(
            "punch-v${version}-windows-x64.exe"
            "punch-v${version}-macos-arm64"
            "punch-v${version}-macos-x64"
            "punch-v${version}-linux-arm64"
            "punch-v${version}-linux-x64"
          )

          test -f "${release_dir}/release-manifest.json"
          jq -e --arg version "$version" '
            .name == "punch" and
            .version == $version and
            (.artifacts | length) == 5 and
            all(.artifacts[]; (.sha256 | test("^[0-9a-fA-F]{64}$")))
          ' "${release_dir}/release-manifest.json" >/dev/null

          for file in "${expected_files[@]}"; do
            test -f "${release_dir}/${file}"
            test -f "${release_dir}/${file}.sha256"
            jq -e --arg file "$file" 'any(.artifacts[]; .file == $file)' \
              "${release_dir}/release-manifest.json" >/dev/null
            (
              cd "$release_dir"
              sha256sum -c "${file}.sha256"
            )
          done

      - name: Store verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/releases
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/releases

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          assets=(dist/releases/*)

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "Punch ${version}" \
              --generate-notes
          fi
