name: Nightly npm

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run audit

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Set nightly version
        run: |
          set -euo pipefail
          base_version="$(jq -r .version package.json)"
          nightly_version="${base_version}-nightly.$(date -u +%Y%m%d%H%M%S)"
          jq --arg version "$nightly_version" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "NIGHTLY_VERSION=${nightly_version}" >> "$GITHUB_ENV"
          echo "Publishing punch-in@${nightly_version}"

      - name: Verify npm package
        run: bun run verify:package

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish nightly to npm
        run: npm publish --tag nightly --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
